#******************************************#
# ~/.tmux.conf
#
# Companion doc: ~/docs/tmux-iterm2.md
# Reload without restarting:  tmux source-file ~/.tmux.conf  (or prefix r)
#******************************************#

#------------------------------------------
# sane defaults
#------------------------------------------
set -g history-limit 50000          # was 2000; scrollback is cheap
set -g escape-time 10               # stop tmux eating ESC (vim feels broken at the 500ms default)
set -g focus-events on              # let vim see focus gain/loss
set -g base-index 1                 # windows start at 1, matching the keyboard
setw -g pane-base-index 1
set -g renumber-windows on          # no gaps after closing a window
set -g display-time 2000            # messages linger long enough to read
set -g set-titles on
set -g set-titles-string "#S / #W"  # iTerm2 tab title follows tmux

#------------------------------------------
# colors
#------------------------------------------
# tmux-256color advertises italics; xterm-256color does not.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # truecolor passthrough to iTerm2

# Let iTerm2 shell-integration escape sequences (badges, status vars) through tmux.
set -g allow-passthrough on

#------------------------------------------
# prefix
#------------------------------------------
# C-a instead of the default C-b: reachable without moving your left hand.
# Cost: C-a no longer reaches the shell as "beginning of line" on its own --
# press it twice (C-a C-a) to send a literal C-a. Same for nested tmux, where
# C-a C-a <key> targets the inner session.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

#------------------------------------------
# mouse
#------------------------------------------
# Click to focus a pane, drag borders to resize, scroll natively.
# Hold Option while dragging to fall back to iTerm2's own text selection.
set -g mouse on

#------------------------------------------
# copy mode: vi keys, macOS clipboard
#------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'

# OSC 52: also fills the macOS clipboard from remote hosts. Requires iTerm2
# Preferences -> General -> Selection -> "Applications in terminal may access clipboard".
set -g set-clipboard on

#------------------------------------------
# splits and windows inherit the current directory
#------------------------------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

#------------------------------------------
# reload
#------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

#------------------------------------------
# shell
#------------------------------------------
# Panes run $SHELL directly. tmux expands ${SHELL} at config-parse time, so
# this follows the login shell instead of a hardcoded path.
#
# Replaced:  set -g default-command "exec reattach-to-user-namespace -l /bin/zsh"
# reattach-to-user-namespace was required on OS X 10.5-10.10 so panes could
# reach the pasteboard; Apple fixed that in 10.11 and pbcopy was verified
# working from a pane without it on Darwin 27.
#
# Side effect: panes are now NON-login shells, so /etc/zprofile (path_helper),
# $ZDOTDIR/.zprofile and $ZDOTDIR/.zlogin no longer run per pane. Verified
# harmless here -- those two personal files are intentionally empty, and the
# resulting PATH holds the same 42 entries. The only ordering change is
# ~/Library/pnpm/bin moving from 21st to 6th, which shadows nothing (it holds
# only pn, pnpm, pnpx, pnx).
#
# To revert, restore the "Replaced" line above.
set -g default-command "${SHELL}"

#******************************************#
# Plugins - The Tmux Plugin Manager
# https://github.com/tmux-plugins/tpm
#
# prefix I  install   prefix U  update   prefix alt-u  uninstall removed
#******************************************#
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-resurrect restores a conservative list of running programs (vi, vim,
# nvim, emacs, man, less, more, tail, top, htop, irssi, mutt). This adds to it.
#   prefix C-s  save      prefix C-r  restore
set -g @resurrect-processes 'ssh "~npm"'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Set explicitly so tpm does not probe for it and log
# "unknown variable: TMUX_PLUGIN_MANAGER_PATH" on every start.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Redundant once tpm manages tmux-resurrect above -- tpm sources resurrect.tmux
# itself, and loading it twice double-binds its keys.
# run-shell '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'

# Other settings
# Prefix + / to search

bind-key / copy-mode \; send-key ?

# Prefix + h to clear screen and history buffer
bind y \
    send-keys "C-c; clear && tmux clear-history" \;\
    send-keys "Enter" \;\
    display 'Screen cleared'

# Setup 'v' to begin selection, just like Vim
bind-key -T copy-mode-vi 'v' send -X begin-selection

 # Setup 'y' to yank (copy), just like Vim
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

# status bar settings: https://github.com/sbernheim4/dotfiles/blob/251a30db0dbbd2953df35bfa0ef43e92ce15b752/tmux/.tmux.conf#L3

# Refresh status line every 5 seconds - Good for when music is playing / update time etc
set -g status-interval 5

#bbbb
# Refresh status line every 5 seconds - Good for when music is playing / update time etc
set -g status-interval 5

# Start window and pane indices at 1.
set -g base-index 1
set -g pane-base-index 0

# Length of tmux status line
set -g status-left-length 30
set -g status-right-length 150

set-option -g status "on"

# Default statusbar color
set-option -g status-style bg=colour237,fg=colour223 # bg=bg1, fg=fg1

# Default window title colors
set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1

# Default window with an activity alert
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3

# Active window title colors
set-window-option -g window-status-current-style bg=red,fg=colour237 # fg=bg1

# Set active pane border color
set-option -g pane-active-border-style fg=colour214

# Set inactive pane border color
set-option -g pane-border-style fg=colour239

# Message info
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# Writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# Pane number display
set-option -g display-panes-active-colour colour1 #fg2
set-option -g display-panes-colour colour237 #bg1

# Clock
set-window-option -g clock-mode-colour colour109 #blue

# Bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg

set-option -g status-left "\
#[fg=colour7, bg=colour241]#{?client_prefix,#[bg=colour167],} ❐ #S \
#[fg=colour241, bg=colour237]#{?client_prefix,#[fg=colour167],}#{?window_zoomed_flag, 🔍,}"

set-option -g status-right "\
#[fg=colour214, bg=colour237] \
#[fg=colour237, bg=colour214] #(~/dotfiles/tmux_scripts/music.sh) \
#[fg=colour223, bg=colour237] #(~/dotfiles/tmux_scripts/uptime.sh) \
#[fg=colour246, bg=colour237]  %b %d '%y\
#[fg=colour109]  %H:%M \
#[fg=colour248, bg=colour239]"

set-window-option -g window-status-current-format "\
#[fg=colour237, bg=colour214]\
#[fg=colour239, bg=colour214] #I* \
#[fg=colour239, bg=colour214, bold] #W \
#[fg=colour214, bg=colour237]"

set-window-option -g window-status-format "\
#[fg=colour237,bg=colour239,noitalics]\
#[fg=colour223,bg=colour239] #I \
#[fg=colour223, bg=colour239] #W \
#[fg=colour239, bg=colour237]"

# Set the history limit so we get lots of scrollback.
setw -g history-limit 50000000
